name: Build Windows candidate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: lilith-pet
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/lilith-pet/node_modules/.cache/electron-builder
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: lilith-pet/package-lock.json
      - name: Install pinned dependencies
        run: npm ci --no-fund
      - name: Verify Python build prerequisite
        run: py -3.12 --version
      - name: Check changed JavaScript syntax
        run: |
          node --check main.js
          node --check firstrun.js
          node --check settings.js
          node --check claude.js
          node --check lilith-hook.js
          node --check slim.js
          node --check ../scripts/prepare-release.cjs
      - name: Build and assemble local release candidate with checksums
        run: npm run release:prepare
      - name: Save candidate for review
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lilith-desktop-windows-candidate
          path: release/v*/
          if-no-files-found: error
          retention-days: 14
