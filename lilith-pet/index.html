<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; media-src 'self'; img-src 'self' data: blob:">
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; user-select: none; }
  canvas { width: 100%; height: 100%; display: block; }
  /* poof: hides window jumps (sofa/bed frames, sitting on a window, tuck) behind a sparkle burst */
  canvas { transition: opacity .22s ease-out; }
  canvas.poof { opacity: 0; transition: none; }
  #fx { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
  .spk { position: absolute; width: var(--z); height: var(--z); margin: calc(var(--z) / -2) 0 0 calc(var(--z) / -2); opacity: 0;
    background: radial-gradient(circle, #fff 0 35%, #ffd3ea 60%, #b8d3ff 100%);
    clip-path: polygon(50% 0, 60% 40%, 100% 50%, 60% 60%, 50% 100%, 40% 60%, 0 50%, 40% 40%); animation: spk .9s ease-out var(--d) forwards; filter: drop-shadow(0 0 3px #fff); }
  .spk.dot { clip-path: none; border-radius: 50%; background: radial-gradient(circle, rgba(255,255,255,.95) 0 25%, rgba(255,190,225,.5) 50%, rgba(255,190,225,0) 72%); }
  @keyframes spk { 0% { opacity: 0; transform: scale(.2) rotate(0); } 30% { opacity: 1; transform: scale(1) rotate(40deg); }
    100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(.3) rotate(110deg); } }
  #bubble { position: absolute; left: 50%; transform: translateX(-50%); width: max-content; max-width: 92%; box-sizing: border-box; top: 1.5%; max-height: 45%; overflow-y: auto; padding: 8px 12px;
    border-radius: 14px; background: rgba(255,255,255,.95); color: #3a2f3f; font: clamp(10px, 4.4vw, 15px)/1.4 "Segoe UI", sans-serif;
    box-shadow: 0 4px 14px rgba(0,0,0,.25); opacity: 0; transition: opacity .25s; pointer-events: none; white-space: pre-wrap; }
  #bubble.show { opacity: 1; pointer-events: auto; }
  #bubble.claude { border-left: 4px solid #d97757; }
  #bubble.action { cursor: pointer; border-bottom: 3px solid #b5163a; }
  #bubble.action:hover { background: #fff; }
  #bubble .chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 7px; white-space: normal; }
  #bubble .chips button { border: 1px solid rgba(181,22,58,.35); border-radius: 999px; padding: 4px 9px; cursor: pointer; background: #fff; color: #3a2f3f;
    font: 600 clamp(9px, 3.4vw, 12px) "Segoe UI", sans-serif; text-align: left; }
  #bubble .chips button:hover { background: #b5163a; color: #fff; }
  #bubble.demo { text-align: center; font-weight: 600; letter-spacing: .2px; border-bottom: 3px solid #b5163a; }
  #setup { position: absolute; left: 5%; right: 5%; bottom: 3%; display: none; padding: 10px; border-radius: 14px;
    background: rgba(29,27,38,.92); box-shadow: 0 6px 18px rgba(0,0,0,.35); border: 1px solid rgba(255,255,255,.12); }
  #setup.show { display: block; }
  #setup input { width: 100%; box-sizing: border-box; padding: 8px 10px; border: 0; border-radius: 10px; outline: none; background: #fff; color: #3a2f3f;
    font: clamp(11px, 4vw, 14px) "Segoe UI", sans-serif; }
  #setup select { padding: 6px 8px; border: 0; border-radius: 10px; background: #fff; color: #3a2f3f; font: clamp(11px, 4vw, 14px) "Segoe UI", sans-serif; }
  #setup .row { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 7px; justify-content: center; }
  #setup button { border: 1px solid rgba(255,255,255,.18); border-radius: 999px; padding: 6px 11px; cursor: pointer; color: #fff; background: rgba(255,255,255,.08);
    font: 600 clamp(10px, 3.6vw, 13px) "Segoe UI", sans-serif; }
  #setup button:hover, #setup button.primary { background: #b5163a; }
  #setup .err { color: #ffb3c1; font: clamp(10px, 3.4vw, 12px) "Segoe UI", sans-serif; margin-top: 5px; min-height: 1em; text-align: center; }
  #chat { position: absolute; left: 6%; right: 6%; bottom: 3%; display: none; }
  #chat.show { display: block; }
  #chat input { width: 100%; box-sizing: border-box; padding: 9px 12px; border: 0; border-radius: 12px; outline: none;
    background: rgba(255,255,255,.96); color: #3a2f3f; font: clamp(10px, 4vw, 14px) "Segoe UI", sans-serif; box-shadow: 0 4px 14px rgba(0,0,0,.25); }
  /* Match the game's white star bubbles, checkerboard panels and coral accents.
     Textures come from the player's extracted sprites; CSS remains usable without them. */
  :root { --ink: #11111b; --accent: #e94358; }
  #bubble { border: 8px solid transparent; border-image: var(--game-bubble, none) 28 fill / 14px / 0 stretch;
    padding: 6px 14px; border-radius: 24px; color: var(--ink); background-color: #fff;
    box-shadow: 0 3px 0 #151326; font-family: "Segoe UI", "Yu Gothic UI", sans-serif; }
  #setup { border: 2px solid #fff; border-radius: 7px;
    background-color: #131315; background-image: var(--game-panel, conic-gradient(#202023 25%, #141416 0 50%, #202023 0 75%, #141416 0));
    background-size: 100% 100%; box-shadow: 3px 4px 0 #11111b; }
  #setup::before { content: ""; position: absolute; width: 9px; height: 9px; left: -5px; top: -5px;
    border: 2px solid white; background: var(--accent); pointer-events: none; }
  #setup button:hover, #setup button.primary { background: var(--accent); }
  #bubble .chips button { border: 1px solid #171722; border-radius: 4px; color: var(--ink); background: #fff; }
  #bubble .chips button:hover { background: var(--accent); color: #fff; border-color: var(--accent); }
  #setup input, #setup select, #chat input { border: 2px solid #1b1926; border-radius: 5px; color: var(--ink); background: #fff; }
  #chat input { box-shadow: 3px 4px 0 #14131f; }
  #setup button { border-radius: 4px; border-color: #fff; }
  #bar button:focus-visible, #bubble button:focus-visible, #setup button:focus-visible,
  #setup input:focus-visible, #setup select:focus-visible, #chat input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  #bubble { scrollbar-width: thin; scrollbar-color: #e94358 #f0edf1; }
  /* Compact launcher/media pill, matching the user's original toolbar. */
  #bar { position: absolute; z-index: 5; left: 50%; top: 8px; transform: translateX(-50%) scale(var(--bar-scale, 1)); transform-origin: top center;
    width: max-content; border: 1px solid #3b3745;
    border-radius: 999px; background: rgba(24, 22, 31, .90); padding: 2px 5px;
    visibility: hidden; pointer-events: none; }
  #bar.show { visibility: visible; pointer-events: auto; }
  #bar [hidden] { display: none; }
  #bar [data-page="main"] { display: flex; align-items: center; gap: 2px; }
  #bar button { display: inline-flex; justify-content: center; align-items: center; min-width: 22px; min-height: 24px;
    padding: 2px 5px; border: 0; border-radius: 6px; background: transparent; color: #e4e0eb;
    font: 500 12px/1 "Segoe UI", sans-serif; cursor: pointer; }
  #bar button:hover, #bar button:focus-visible { background: #ffffff16; color: #fff; }
  #bar button:focus { outline: none; }
  #bar button:focus-visible { outline: 1px solid #aaa2b6; outline-offset: -1px; }
  #bar .media-divider { width: 1px; height: 15px; background: #49434f; margin: 0 2px; }
  #bar svg { width: 11px; height: 11px; fill: currentColor; pointer-events: none; }
  /* Quiet glass-style chat; backdrop blur is progressive within the pet surface. */
  #chat { left: 50%; right: auto; width: min(82%, 360px); transform: translateX(-50%); bottom: 3%; }
  #chat input { padding: 8px 12px; font: 400 13px/1.4 "Segoe UI", sans-serif;
    color: #f5f2fb; caret-color: #e1d5f4; background: rgba(24, 22, 34, .76);
    border: 1px solid rgba(225, 216, 243, .3); border-radius: 14px;
    backdrop-filter: blur(16px); box-shadow: 0 4px 16px #0003, inset 0 1px 0 #ffffff12; }
  #chat input:focus-visible { outline: 1px solid #d0c1e7; outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { #bar, #bubble { transition: none; } }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="fx"></div>
<div id="bubble"></div>
<div id="bar" role="region" aria-label="Lilith controls" inert>
  <div data-page="main">
    <button data-a="claude" title="Open Claude Code">Claude</button>
    <button data-a="chatgpt" title="Open Codex / ChatGPT">GPT</button>
    <span class="media-divider" aria-hidden="true"></span>
    <button data-a="music-prev" aria-label="Previous song" title="Previous song"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 2h2v12H2zM14 2v12L5 8z"/></svg></button>
    <button data-a="music-toggle" aria-label="Play or pause music" title="Play / pause"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M1 2v12l8-6zM10 2h2v12h-2zM14 2h2v12h-2z"/></svg></button>
    <button data-a="music-next" aria-label="Next song" title="Next song"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M12 2h2v12h-2zM2 2v12l9-6z"/></svg></button>
  </div>
</div>
<div id="setup"><div id="setup-body"></div><div class="err" id="setup-err"></div></div>
<div id="chat"><input id="msg" autocomplete="off"></div>
<script src="node_modules/@esotericsoftware/spine-webgl/dist/iife/spine-webgl.js"></script>
<script src="i18n.js"></script>
<script src="pet.js"></script>
<script src="demo.js"></script>
<script src="timefit.js"></script>
<script src="life.js"></script>
<script src="setup.js"></script>
<script src="dialogue.js"></script>
<script src="alive.js"></script>
</body>
</html>
